services:
  web:
    image: ${DOCKER_HUB_USERNAME}/habit-tracker:${IMAGE_TAG:-latest}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  nginx:
    image: ${DOCKER_HUB_USERNAME}/nginx:${IMAGE_TAG:-latest}
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "81:80"
    depends_on:
      web:
        condition: service_started

  worker:
    image: ${DOCKER_HUB_USERNAME}/habit-tracker:${IMAGE_TAG:-latest}
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: ${DOCKER_HUB_USERNAME}/habit-tracker:${IMAGE_TAG:-latest}
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    env_file:
      - .env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis
    volumes:
      - redis_volume:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    image: ${DOCKER_HUB_USERNAME}/habit-tracker:${IMAGE_TAG:-latest}
    command: python bot.py
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  redis_volume:
  media_volume: